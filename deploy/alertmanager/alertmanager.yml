# Alertmanager configuration for KubeX.
#
# This config is applied via the kube-prometheus-stack Helm chart
# (deploy/helm-values/kube-prometheus-stack.yaml, alertmanager.config block).
# This standalone file exists as a readable reference and for local testing.
#
# SLACK_WEBHOOK_URL is injected via a Kubernetes secret
# (alertmanager-slack-secret.yaml) mounted into Alertmanager by the Helm chart.

global:
  slack_api_url_file: /etc/alertmanager/secrets/kubex-alertmanager-slack/url

route:
  receiver: "null"
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - match:
        alertname: DeployDegradation
      receiver: slack-kubex
      continue: false

receivers:
  - name: "null"
  - name: slack-kubex
    slack_configs:
      - channel: "#deploylens-alerts"
        send_resolved: true
        title: >-
          {{ if eq .Status "resolved" }}:white_check_mark:{{ else }}:rotating_light:{{ end }}
          Deploy #{{ .CommonLabels.deploy_id }} — {{ .CommonLabels.service }}
        text: >-
          *Score:* {{ .CommonAnnotations.summary }}
          *Severity:* {{ .CommonLabels.severity }}
          *Evidence:* {{ .CommonAnnotations.description }}
        color: >-
          {{ if eq .Status "resolved" }}good{{ else if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}
    webhook_configs:
      # host.docker.internal only reaches ingest when it's on the SAME
      # docker host as this Kind cluster (local dev). For the Azure VM demo
      # topology (Kind cluster local, ingest remote), this must be the VM's
      # public URL — swap back to host.docker.internal:8000 for local dev.
      - url: https://kubex-demo-pt.southeastasia.cloudapp.azure.com/api/alerts/inbound
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/kubex-alertmanager-webhook/token

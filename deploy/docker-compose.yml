services:
  # ── PostgreSQL 16 (opt-in local escape hatch) ───────────────────
  # The platform database is managed Supabase Postgres by default (see
  # DATABASE_URL in .env, #817) — this container is NOT started unless
  # you explicitly opt in with:
  #   docker compose --profile local-db up
  # and point DATABASE_URL at postgresql+asyncpg://kubex:<pw>@postgres:5432/kubex
  # yourself for offline/no-Supabase dev.
  postgres:
    image: postgres:16
    container_name: kubex-postgres
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: kubex
      POSTGRES_USER: kubex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kubex}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubex -d kubex"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Ingest Service (FastAPI) ───────────────────────────────────
  # Receives webhooks from GitHub Actions and ArgoCD, correlates
  # them into deployment records, and serves the REST API.
  # Build context points to services/ingest/ — Dockerfile lives there.
  ingest:
    build:
      context: ../services/ingest
      dockerfile: Dockerfile
    container_name: kubex-ingest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # DATABASE_URL itself comes from env_file above (Supabase by
      # default — see .env's Supabase section). Only override it here
      # when explicitly running the local-db profile.
      PROM_URL: ${PROM_URL:-http://host.docker.internal:9090}
      OBSERVATION_WINDOW: ${OBSERVATION_WINDOW:-15m}
      BASELINE_WINDOW: ${BASELINE_WINDOW:-30m}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:3001/mcp}
      GRAFANA_URL: ${GRAFANA_URL:-http://grafana:3000}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mcp-server:
        condition: service_started
      grafana:
        condition: service_started

  # ── Detection Agent ─────────────────────────────────────────────
  # Autonomous batch processor that scores deployment health every
  # 60 seconds. No HTTP API — connects to PostgreSQL, Prometheus,
  # and Alertmanager directly.
  agent:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    container_name: kubex-agent
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # DATABASE_URL comes from env_file above — see the ingest block.
      PROM_URL: ${PROM_URL:-http://host.docker.internal:9090}
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-http://host.docker.internal:9093}
      BASELINE_WINDOW: ${BASELINE_WINDOW:-30m}
      OBSERVATION_WINDOW: ${OBSERVATION_WINDOW:-15m}
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ── MCP Server ─────────────────────────────────────────────────
  # Model Context Protocol server exposing deployment, metrics,
  # and log tools for natural-language incident investigation.
  mcp-server:
    build:
      context: ../services/mcp-server
      dockerfile: Dockerfile
    container_name: kubex-mcp
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # DATABASE_URL and MCP_INTERNAL_TOKEN come from env_file above —
      # don't redeclare MCP_INTERNAL_TOKEN as ${MCP_INTERNAL_TOKEN} here,
      # it resolves empty without an explicit --env-file flag and
      # crash-loops the server.
      # PROM_URL/LOKI_URL removed (#840) — this server no longer talks to
      # Prometheus/Loki directly, it relays through ingest's
      # /internal/relay/* endpoints (see INGEST_URL below).
      INGEST_URL: ${INGEST_URL:-http://ingest:8000}
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "3001"
      # MCP_INTERNAL_TOKEN comes from env_file (../.env) above — don't
      # redeclare it here as ${MCP_INTERNAL_TOKEN}, which resolves blank
      # and crash-loops the server when compose runs without --env-file.
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ── Grafana ────────────────────────────────────────────────────
  # Visualization layer — provisioned datasources (Prometheus, Loki,
  # PostgreSQL) and dashboards load automatically from mounted YAML.
  # Embedding enabled for the React shell iframe integration.
  grafana:
    image: grafana/grafana:13.2.1
    container_name: kubex-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-kubex}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      # Only the fields datasources.yml's $__env{} expansion needs —
      # deliberately NOT `env_file: ../.env`, which would hand this
      # container every ingest secret (ANTHROPIC_API_KEY,
      # MCP_INTERNAL_TOKEN, JWT_SECRET, GitHub OAuth/App secrets) it has
      # no reason to hold.
      SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
      SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-5432}
      SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-postgres}
      SUPABASE_GRAFANA_RO_USER: ${SUPABASE_GRAFANA_RO_USER:-}
      SUPABASE_GRAFANA_RO_PASSWORD: ${SUPABASE_GRAFANA_RO_PASSWORD:-}
      # Bearer the kubex-prometheus datasource sends to ingest's /api/prom
      # relay (#832). Must match ingest's GRAFANA_DATASOURCE_TOKEN.
      GRAFANA_DATASOURCE_TOKEN: ${GRAFANA_DATASOURCE_TOKEN:-}
      # Server-side PNG rendering (#835). The embedded panels are static
      # 256px images in the shell — rendering them to PNG sidesteps the
      # /d-solo/ HTML's relative-path asset 404s (E11-T2). Grafana calls
      # the renderer, which loads the panel back from GF_RENDERING_CALLBACK_URL.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      # Grafana 13+ refuses to start rendering at all without a non-default
      # renderer_token (must match the renderer's AUTH_TOKEN below) — found
      # 2026-09-08 bumping from 11.6.0, where this wasn't required.
      GF_RENDERING_RENDERER_TOKEN: ${GRAFANA_RENDERER_TOKEN:-}
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./certs/supabase-root-2021-ca.pem:/etc/grafana/certs/supabase-root-2021-ca.pem:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  renderer:
    # 3.11.6 (paired with Grafana 11.6.0) never signals render-readiness
    # for /d-solo/ solo-panel embeds under Grafana's dashboardSceneSolo —
    # every panel PNG render hung until timeout regardless of panel state
    # (found 2026-09-08). v5.12.2 (paired with the Grafana 13.2.1 bump
    # above) fixed it outright — verified render times dropped to ~8-17s.
    image: grafana/grafana-image-renderer:v5.12.2
    container_name: kubex-grafana-renderer
    restart: unless-stopped
    environment:
      ENABLE_METRICS: "false"
      # The renderer only ever needs to reach Grafana on the compose net.
      RENDERING_MODE: default
      # Must match Grafana's GF_RENDERING_RENDERER_TOKEN above.
      AUTH_TOKEN: ${GRAFANA_RENDERER_TOKEN:-}
    expose:
      - "8081"

volumes:
  pgdata:  # only populated when running --profile local-db
  grafana_data:

services:
  # ── PostgreSQL 16 (opt-in local escape hatch) ───────────────────
  # The platform database is managed Supabase Postgres by default (see
  # DATABASE_URL in .env, #817) — this container is NOT started unless
  # you explicitly opt in with:
  #   docker compose --profile local-db up
  # and point DATABASE_URL at postgresql+asyncpg://kubex:<pw>@postgres:5432/kubex
  # yourself for offline/no-Supabase dev.
  postgres:
    image: postgres:16
    container_name: kubex-postgres
    restart: unless-stopped
    profiles: ["local-db"]
    environment:
      POSTGRES_DB: kubex
      POSTGRES_USER: kubex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kubex}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubex -d kubex"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Ingest Service (FastAPI) ───────────────────────────────────
  # Receives webhooks from GitHub Actions and ArgoCD, correlates
  # them into deployment records, and serves the REST API.
  # Build context points to services/ingest/ — Dockerfile lives there.
  ingest:
    build:
      context: ../services/ingest
      dockerfile: Dockerfile
    container_name: kubex-ingest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # DATABASE_URL itself comes from env_file above (Supabase by
      # default — see .env's Supabase section). Only override it here
      # when explicitly running the local-db profile.
      PROM_URL: ${PROM_URL:-http://host.docker.internal:9090}
      OBSERVATION_WINDOW: ${OBSERVATION_WINDOW:-15m}
      BASELINE_WINDOW: ${BASELINE_WINDOW:-30m}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://mcp-server:3001/mcp}
      GRAFANA_URL: ${GRAFANA_URL:-http://grafana:3000}
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_SERVICE_ACCOUNT_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      mcp-server:
        condition: service_started
      grafana:
        condition: service_started

  # ── Detection Agent ─────────────────────────────────────────────
  # Autonomous batch processor that scores deployment health every
  # 60 seconds. No HTTP API — connects to PostgreSQL, Prometheus,
  # and Alertmanager directly.
  agent:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    container_name: kubex-agent
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # DATABASE_URL comes from env_file above — see the ingest block.
      PROM_URL: ${PROM_URL:-http://host.docker.internal:9090}
      ALERTMANAGER_URL: ${ALERTMANAGER_URL:-http://host.docker.internal:9093}
      BASELINE_WINDOW: ${BASELINE_WINDOW:-30m}
      OBSERVATION_WINDOW: ${OBSERVATION_WINDOW:-15m}
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ── MCP Server ─────────────────────────────────────────────────
  # Model Context Protocol server exposing deployment, metrics,
  # and log tools for natural-language incident investigation.
  mcp-server:
    build:
      context: ../services/mcp-server
      dockerfile: Dockerfile
    container_name: kubex-mcp
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # DATABASE_URL and MCP_INTERNAL_TOKEN come from env_file above —
      # don't redeclare MCP_INTERNAL_TOKEN as ${MCP_INTERNAL_TOKEN} here,
      # it resolves empty without an explicit --env-file flag and
      # crash-loops the server.
      PROM_URL: ${PROM_URL:-http://host.docker.internal:9090}
      LOKI_URL: ${LOKI_URL:-http://host.docker.internal:3100}
      MCP_TRANSPORT: http
      MCP_HTTP_PORT: "3001"
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  # ── Grafana ────────────────────────────────────────────────────
  # Visualization layer — provisioned datasources (Prometheus, Loki,
  # PostgreSQL) and dashboards load automatically from mounted YAML.
  # Embedding enabled for the React shell iframe integration.
  grafana:
    image: grafana/grafana:11.6.0
    container_name: kubex-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      # Supplies SUPABASE_DB_HOST/PORT/NAME/GRAFANA_RO_USER/GRAFANA_RO_PASSWORD,
      # expanded into datasources.yml via Grafana's $__env{} syntax.
      - ../.env
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-kubex}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: lax
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy
        required: false

volumes:
  pgdata:  # only populated when running --profile local-db
  grafana_data:

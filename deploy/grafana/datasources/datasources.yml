apiVersion: 1

datasources:
  # ── Prometheus (org-scoped, via the ingest cluster-agent relay, #832) ──
  # NOT a Prometheus — ingest's /api/prom speaks the Prometheus HTTP API
  # but resolves the caller's org (org_id="..." matcher, injected by the
  # panel proxy) to that org's connected cluster and relays the query
  # through cluster_queries. The bearer is what makes the in-query org id
  # trustworthy (see app/auth.py::verify_grafana_datasource_token).
  - name: Prometheus
    uid: kubex-prometheus
    type: prometheus
    access: proxy
    url: http://ingest:8000/api/prom
    isDefault: true
    editable: false
    jsonData:
      # GET so the relay endpoint only has to read query params.
      httpMethod: GET
      timeInterval: "15s"
      httpHeaderName1: Authorization
    secureJsonData:
      httpHeaderValue1: "Bearer $__env{GRAFANA_DATASOURCE_TOKEN}"

  # ── Loki (logs from Kind cluster, port-forwarded to host) ──────────
  - name: Loki
    uid: kubex-loki
    type: loki
    access: proxy
    url: http://host.docker.internal:3100
    editable: false
    jsonData:
      maxLines: 1000

  # ── PostgreSQL (deployments, health scores, DORA views) ─────────────
  # Managed Supabase Postgres (#817) — $__env{} is Grafana's built-in
  # provisioning-file env expansion, resolved from the container's
  # environment (see deploy/docker-compose.yml's grafana env_file).
  - name: PostgreSQL
    uid: kubex-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: $__env{SUPABASE_DB_HOST}:$__env{SUPABASE_DB_PORT}
    user: $__env{SUPABASE_GRAFANA_RO_USER}
    editable: false
    jsonData:
      database: $__env{SUPABASE_DB_NAME}
      # verify-full: Supabase signs its pooler certs with its own private
      # CA, mounted read-only into this container (see docker-compose.yml)
      # — full chain + hostname verification, not just encryption.
      sslmode: verify-full
      sslRootCertFile: /etc/grafana/certs/supabase-root-2021-ca.pem
      # Supabase's free/small-tier connection limits are tight —
      # keep this datasource's pool small.
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: $__env{SUPABASE_GRAFANA_RO_PASSWORD}

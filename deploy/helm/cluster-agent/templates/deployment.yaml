apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "cluster-agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "cluster-agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "cluster-agent.selectorLabels" . | nindent 8 }}
      annotations:
        # A token rotation (helm upgrade with a new .Values.token, or a
        # GitOps sync picking up a new value) only changes the Secret, not
        # this pod template — without this checksum, kubelet keeps the old
        # Pod running with the now-invalid token mounted until it happens
        # to be rescheduled for an unrelated reason (CodeRabbit, PR #802).
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "cluster-agent.fullname" . }}
      containers:
        - name: cluster-agent
          image: "{{ .Values.image.repository }}:{{ required "image.tag is required — pin an immutable short-SHA tag, see values.yaml" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: DEPLOYLENS_ENDPOINT
              value: {{ required "endpoint is required — the central KubeX ingest URL" .Values.endpoint | quote }}
            - name: CLUSTER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "cluster-agent.fullname" . }}-token
                  key: CLUSTER_TOKEN
            - name: HEARTBEAT_INTERVAL_SECONDS
              value: {{ .Values.heartbeatIntervalSeconds | quote }}
            - name: QUERY_POLL_INTERVAL_SECONDS
              value: {{ .Values.queryPollIntervalSeconds | quote }}
            - name: ARGOCD_RECHECK_INTERVAL_SECONDS
              value: {{ .Values.argocdRecheckIntervalSeconds | quote }}
            {{- if .Values.allowInsecureEndpoint }}
            - name: ALLOW_INSECURE_ENDPOINT
              value: "true"
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cluster-agent.fullname" . }}-token
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "cluster-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  CLUSTER_TOKEN: {{ required "token is required — get it from POST /api/clusters or the Add Cluster wizard" .Values.token | quote }}

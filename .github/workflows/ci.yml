name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-ingest:
    name: Ingest Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx pytest-cov

      - name: Run tests
        run: pytest tests/ -v

  test-cluster-agent:
    name: Cluster Agent Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/cluster-agent
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/cluster-agent/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v

  test-mcp-server:
    name: MCP Server Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/mcp-server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kubex
          POSTGRES_PASSWORD: kubex
          POSTGRES_DB: kubex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/mcp-server/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      # Applies the same migration set the real ingest service does, via
      # its migration runner — so list_deployments.integration.test.ts
      # (the E20-T3 #610 cross-org isolation test) actually runs in CI
      # instead of silently skipping for lack of DATABASE_URL.
      - name: Apply migrations
        run: |
          pip install psycopg2-binary
          python ../ingest/migrations/run.py --url "postgresql://kubex:kubex@localhost:5432/kubex"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://kubex:kubex@localhost:5432/kubex
        run: npm test

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

  test-agent:
    name: Agent Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v

name: Cluster Agent Image

on:
  push:
    branches: [main, dev]
    paths:
      - "services/cluster-agent/**"
      - ".github/workflows/agent.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "services/cluster-agent/**"
      - ".github/workflows/agent.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/puliththewmika/kubex-cluster-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: vars
        # github.ref_name is "802/merge" on a pull_request event — not a
        # valid Docker tag component — so the floating branch/latest tag
        # only applies on push, where ref_name is a real branch name.
        run: |
          short_sha="${GITHUB_SHA::7}"
          floating=""
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ "${{ github.ref_name }}" = "main" ]; then
              floating="latest"
            else
              floating="${{ github.ref_name }}"
            fi
          fi
          {
            echo "tags<<EOF"
            printf '%s:%s\n' "$IMAGE" "$short_sha"
            if [ -n "$floating" ]; then
              printf '%s:%s\n' "$IMAGE" "$floating"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
        env:
          IMAGE: ${{ env.IMAGE }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/cluster-agent
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.vars.outputs.tags }}

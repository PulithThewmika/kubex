name: Cluster Agent Image

on:
  push:
    branches: [main, dev]
    paths:
      - "services/cluster-agent/**"
      - ".github/workflows/agent.yml"
  pull_request:
    branches: [dev, main]
    paths:
      - "services/cluster-agent/**"
      - ".github/workflows/agent.yml"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/puliththewmika/kubex-cluster-agent

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to ghcr.io
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: services/cluster-agent
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.vars.outputs.short_sha }}
            ${{ env.IMAGE }}:${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
